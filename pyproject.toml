[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-herder"
version = "0.1.0"
description = "Minimal filesystem-first GUI for Codex-driven analysis orchestration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.13",
  "PySide6>=6.7",
  "PyYAML>=6.0",
  "pyte>=0.8.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
codex-herder = "codex_herder.main:main"
codex-usage = "codex_herder.main:usage_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
